name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || github.run_number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # refs/tags/v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # refs/tags/v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Graphviz
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends graphviz

      - name: Install Psyre with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run core pytest (no optional array backends)
        run: pytest

      - name: Run optional NumPy and JAX tests
        run: |
          pip install -e ".[test,jax]"
          pytest

      - name: Verify non-editable wheel import of psyre and psyre.equations
        run: |
          python -m venv /tmp/psyre_wheel_venv
          /tmp/psyre_wheel_venv/bin/pip install --no-deps .
          /tmp/psyre_wheel_venv/bin/python -c \
            "import sys, psyre, psyre.equations; assert 'numpy' not in sys.modules and 'jax' not in sys.modules; assert hasattr(psyre.equations, 'psyre_equations')"
