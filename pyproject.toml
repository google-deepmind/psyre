[build-system]
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "psyre"
description = "Psyre synchronous and Kahn reactive dataflow DSL in Python."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Psyre Authors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
jax = [
    "jax>=0.4.30",
    "numpy>=1.26.0",
]
numpy = [
    "numpy>=1.26.0",
]
viz = [
    "pydot>=1.4.2",
]
test = [
    "absl-py>=2.0.0",
    "pydot>=1.4.2",
    "pytest>=8.0.0",
]

[tool.flit.module]
name = "psyre"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = [
    "tests",
    "examples/tests",
    "src/psyre/equations/tests",
    "src/psyre/equations/examples/tests",
    "src/psyre/jax/examples",
    "src/psyre/jax/tests",
    "src/psyre/numpy/examples",
    "src/psyre/numpy/tests",
]
